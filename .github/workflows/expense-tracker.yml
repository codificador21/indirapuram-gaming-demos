name: expense-tracker

on:
  push:
    paths: ['expense-tracker/**', '.github/workflows/expense-tracker.yml']
  pull_request:
    paths: ['expense-tracker/**', '.github/workflows/expense-tracker.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expense-tracker
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U expense -d expense_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://expense:expense@localhost:5432/expense_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expense-tracker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
